[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxbuild"
description = "CMake Extension Builder"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cmake", "pybind11", "build", "monorepo"]
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "setuptools>=75",
    "build>=1.2",
    "pydantic>=2.9",
    "click>=8.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["black>=24"]
test = ["pytest>=8"]

[project.scripts]
cxbuild = "cxbuild.cli:cli"

[project.urls]
homepage = "https://github.com/crungelab/cxbuild"
documentation = "https://crungelab.github.io/cxbuild/"
repository = "https://github.com/crungelab/cxbuild"
changelog = "https://github.com/crungelab/cxbuild/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "cxbuild/__about__.py"

[tool.hatch.envs.default]
python = "3.12"
dependencies = ["pytest", "pytest-cov"]

[tool.hatch.envs.default.scripts]
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=cxbuild --cov=tests {args}"
no-cov = "cov --no-cov {args}"

[tool.hatch.envs.docs]
dependencies = ["sphinx", "furo", "sphinxcontrib-apidoc", "sphinxemoji"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build docs docs/_build"

[tool.coverage.run]
branch = true
parallel = true
omit = ["cxbuild/__about__.py"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.cxbuild]
projects = ["pkg/*"]