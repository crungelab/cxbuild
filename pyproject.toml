[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxbuild"
description = "CMake Extension Builder"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cmake", "pybind11", "build", "monorepo"]
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "packaging>=24.2",
    "pydantic>=2.9",
    "click>=8.1",
    "loguru>=0.7",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["black>=24"]

[project.scripts]
cxbuild = "cxbuild.cli:cli"

[project.urls]
homepage = "https://github.com/crungelab/cxbuild"
documentation = "https://crungelab.github.io/cxbuild/"
repository = "https://github.com/crungelab/cxbuild"
changelog = "https://github.com/crungelab/cxbuild/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "cxbuild/__about__.py"

# Tests live in tests/, with their own detached environment (tests/pyproject.toml).

[tool.hatch.envs.docs]
dependencies = ["sphinx", "furo", "sphinxcontrib-apidoc", "sphinxemoji"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build docs docs/_build"