[build-system]
requires = ["cxbuild"]
build-backend = "cxbuild.backend"

# A portion of the cxbns namespace package, laid out like the crunge projects:
# no cxbns/__init__.py anywhere, the module under cxbns/second/.
[project]
name = "cxbns-second"
version = "0.0.1"
description = "cxbuild pipeline-test fixture: a namespace-package portion"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["cxbns", "cxbns.second"]  # crunge's workaround for the setuptools backend

[tool.cxbuild.extension]
name = "cxbns.second._core"  # install prefix cxbns/second, matching the CMake install DESTINATION
